
name: CommerceHub Scheduled Jobs

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  scheduled-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run payment reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://commerce-hub-plum.vercel.app/api/cron/payment-reminders"

      - name: Run order expiry
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://commerce-hub-plum.vercel.app/api/cron/expire-orders"

